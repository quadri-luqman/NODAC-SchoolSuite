button:hover,.btn:hover{background:var(--navy2)}button.alt{background:#fff;color:var(--navy);border:1px solid var(--navy)}button.alt:hover{background:var(--tint);border-color:var(--orange);color:var(--orange-d)}
button.bad{background:var(--bad);border-color:var(--bad)}button.org{background:var(--orange);border-color:var(--orange);color:#fff}button.org:hover{background:var(--orange-d)}button:disabled{opacity:.5}
button.pill{background:#fff;color:var(--navy);border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:12px}button.pill b{color:var(--orange-d);margin-left:3px}button.pill:hover{border-color:var(--orange)}button.pill.on{background:var(--navy);color:#fff;border-color:var(--navy)}button.pill.on b{color:#ffb77a}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
input,select,textarea{padding:8px;border:1px solid #b9c3d8;border-radius:8px;font-size:14px;width:100%;background:#fff;color:var(--ink)}input:focus,select:focus{outline:2px solid #F47B2055;border-color:var(--orange)}input[type=checkbox]{width:auto;accent-color:var(--orange)}
label{display:block;font-size:12px;color:#44506b;margin:8px 0 2px;font-weight:600}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}@media(max-width:560px){.g2{grid-template-columns:1fr}}
.tag{font-size:11px;padding:2px 8px;border-radius:10px;background:#e8ecf4;font-weight:600}.VALID{background:#d7eed9}.CANCELLED{background:#fde2c3}.REVERSAL{background:#fde2c3}.REFUND{background:#d8e6fb}.pend{background:#ffe3c9}
#modal{position:fixed;inset:0;background:#071a4095;display:none;place-items:center;z-index:50;padding:10px}#modal.on{display:grid}

#toast{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:var(--navyd);color:#fff;padding:10px 16px;border-radius:10px;z-index:60;display:none;max-width:90%;border-left:4px solid var(--orange)}

.rcpt{border:2px solid var(--navy);border-radius:6px;padding:16px;max-width:540px;margin:auto;background:#fff;break-inside:avoid}.rcpt h2{margin:0;color:var(--navy);font-size:17px}.rcpt .t{background:var(--orange);color:#fff;text-align:center;padding:5px;margin:10px 0;font-weight:700;letter-spacing:1px}
.rcpt .brand{display:flex;align-items:center;gap:10px;border-bottom:3px solid var(--navy);padding-bottom:8px}.rcpt .brand .lg{width:38px;height:38px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:800;font-size:13px;border:3px solid var(--orange);flex:none}

 body:not(.bp) *{visibility:hidden}body:not(.bp) #print-area,body:not(.bp) #print-area *{visibility:visible}body:not(.bp) #print-area{position:absolute;left:0;top:0;width:100%}
 body.bp>*:not(#bulkprint){display:none!important}body.bp #bulkprint{display:block}
 .pg{break-after:page;page-break-after:always}.pg:last-child{break-after:auto;page-break-after:auto}

}

<script>
"use strict";
/* ===================== pure helpers (unit-tested) ===================== */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toKobo(s){            // "1,234.5" -> 123450 (integer arithmetic, no floats)
  s = String(s ?? '').replace(/[,\s₦]/g, ''); if(!/^-?\d+(\.\d{1,2})?$/.test(s)) return null;
  const neg = s[0] === '-'; if(neg) s = s.slice(1);
  const [a, b = ''] = s.split('.'); const k = parseInt(a, 10) * 100 + parseInt((b + '00').slice(0, 2), 10);
  return neg ? -k : k;
}
function fmt(k){ k = Number(k || 0); const neg = k < 0; k = Math.abs(k); return (neg ? '-' : '') + Math.floor(k / 100).toLocaleString('en-NG') + '.' + String(k % 100).padStart(2, '0'); }
const ONES = ['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'];
const TENS = ['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
function words(n){
  if(n === 0) return 'Zero'; if(n < 20) return ONES[n];
  if(n < 100) return TENS[Math.floor(n / 10)] + (n % 10 ? '-' + ONES[n % 10] : '');
  if(n < 1000) return ONES[Math.floor(n / 100)] + ' Hundred' + (n % 100 ? ' and ' + words(n % 100) : '');
  const sc = [[1e9, 'Billion'], [1e6, 'Million'], [1e3, 'Thousand']];
  for(const [v, nm] of sc){ if(n >= v){ const r = n % v; return words(Math.floor(n / v)) + ' ' + nm + (r ? (r < 100 ? ' and ' : ', ') + words(r) : ''); } }
}
function nairaWords(k){ k = Math.abs(k); const n = Math.floor(k / 100), c = k % 100; return words(n) + ' Naira' + (c ? ' and ' + words(c) + ' Kobo' : '') + ' only'; }
function outstandingAfter(billed, pays, studentId, createdAt){   // billed - sum(AR credits up to and including this entry)
  return billed - pays.filter(p => p.student_id === studentId && p.created_at <= createdAt).reduce((a, p) => a + Number(p.ar_kobo), 0);
}
const uuid = () => (crypto.randomUUID ? crypto.randomUUID() : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => { const r = Math.random() * 16 | 0; return (c === 'x' ? r : (r & 3 | 8)).toString(16); }));
const CATS = ['School Fees','PTA Levy','Examination Fee','Lesson Fee','Uniforms','Sportswear','Textbooks','Other Income'];
const METHODS = ['Cash','Bank Transfer','POS','Cheque'];
if(typeof module !== 'undefined') module.exports = { toKobo, fmt, words, nairaWords, outstandingAfter, esc };
</script>
<script>
"use strict";
if (typeof document !== 'undefined' && document.getElementById('app')) (function(){
/* ============================ state ============================ */
const $ = (s, r = document) => r.querySelector(s);
let cfg = { local: true }, sb = null, lastBackup = undefined, chan = null, live = false, loadTimer = null;
const S = { user: null, profile: null, school: null, classes: [], terms: [], students: [], fees: [], balances: [], payments: [], invoices: [], team: [],
  staff: [], salary: [], payroll: [], loans: [], loanBal: [], expenses: [], expPay: [], itemStock: [], purchases: [], sales: [] };
let Q = JSON.parse(localStorage.getItem('nm_queue') || '[]');
let flushing = false;
const saveQ = () => localStorage.setItem('nm_queue', JSON.stringify(Q));
const canWrite = () => S.profile && ['owner', 'bursar'].includes(S.profile.role);
const isOwner = () => S.profile && S.profile.role === 'owner';
const online = () => true;                     // local edition: every write is applied immediately on this device
const isNetErr = e => false;
function toast(m, ms = 3500){ const t = $('#toast'); t.textContent = m; t.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(() => t.style.display = 'none', ms); }
function modal(html){ $('#box').innerHTML = html; $('#modal').classList.add('on'); }
let modalSticky = false;
function closeModal(){ modalSticky = false; $('#modal').classList.remove('on'); }
$('#modal').addEventListener('mousedown', e => { if(e.target.id === 'modal' && !modalSticky) closeModal(); });

/* ===================== printing (bulk or single) ===================== */
function printDocs(htmls, per){
  per = per === 1 ? 1 : 2; let host = $('#bulkprint');
  if(!host){ host = document.createElement('div'); host.id = 'bulkprint'; document.body.appendChild(host); }
  const pages = []; for(let i = 0; i < htmls.length; i += per) pages.push(htmls.slice(i, i + per));
  host.innerHTML = pages.map(g => `<section class="pg pp${per}">${g.join('')}</section>`).join('');
  document.body.classList.add('bp');
  const done = () => { document.body.classList.remove('bp'); host.innerHTML = ''; window.removeEventListener('afterprint', done); };
  window.addEventListener('afterprint', done);
  setTimeout(() => { window.print(); setTimeout(done, 1500); }, 60);
}
const selPay = new Set(), selSlip = new Set(), mailed = new Set();
const LOCK_SVG = '<svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>';

/* ===================== dashboard password gate ===================== */
let dashOK = false, dashSet = false, lastAct = Date.now();
const IDLE_MS = 10 * 60 * 1000;
async function initDash(){ try { dashSet = (await NM_LOCAL_API.dashState()).set; } catch(e){ dashSet = false; } }
function syncLock(){ const b = $('#lk'); if(b) b.style.display = dashOK ? '' : 'none'; }
function lockDash(msg){ dashOK = false; syncLock(); if((location.hash || '#/') === '#/') route(); if(msg) toast(msg, 5000); }
['click', 'keydown', 'touchstart'].forEach(ev => document.addEventListener(ev, () => { lastAct = Date.now(); }, true));
setInterval(() => { if(dashOK && Date.now() - lastAct > IDLE_MS) lockDash('Dashboard locked after 10 minutes of inactivity'); }, 20000);
const failState = () => { try { return JSON.parse(localStorage.getItem('nm_dash_fail') || '{}'); } catch(e){ return {}; } };
function dashGate(){
  if(!dashSet) return `<div class="gate"><div class="gh"><div class="lk">${LOCK_SVG}</div><h2>Set the dashboard password</h2></div><div class="gb">
    <p class="muted">The dashboard shows the school's money position. Choose a password and share it <b>only with the accountant and the proprietors</b>.</p>
    <label>New password (at least 6 characters)</label><input id="dpw" type="password" autocomplete="new-password"><label>Repeat password</label><input id="dpw2" type="password" autocomplete="new-password">
    <p><button class="org" data-act="dashcreate">Create password</button></p></div></div>`;
  return `<div class="gate"><div class="gh"><div class="lk">${LOCK_SVG}</div><h2>Dashboard is locked</h2></div><div class="gb">
    <p class="muted">Restricted to the accountant and the proprietors. Enter the dashboard password.</p>
    <label>Password</label><input id="dpw" type="password" autocomplete="current-password">
    <p><button class="org" data-act="dashunlock">Unlock dashboard</button> <button class="alt" data-act="dashforgot">Forgot password?</button></p></div></div>`;
}
function showCode(code, title){
  modalSticky = true;
  modal(`<h3>${esc(title)}</h3><p>Your <b>recovery code</b> is below. It is the only way to reset the dashboard password if it is forgotten, and it is shown <b>once</b>.</p><div class="code">${esc(code)}</div>
  <p class="muted">Write it down and keep it with a proprietor, not in this computer.</p><p><button class="org" data-act="codeok">I have written it down</button></p>`);
}
async function dashActs(a){
  if(a === 'dashcreate'){
    const p = val('dpw'), p2 = val('dpw2'); if(p.length < 6){ toast('Use at least 6 characters'); return true; } if(p !== p2){ toast('The two passwords do not match'); return true; }
    try { const code = await NM_LOCAL_API.dashCreate(p); dashSet = true; dashOK = true; lastAct = Date.now(); syncLock(); showCode(code, 'Dashboard password created'); } catch(e){ toast(e.message, 6000); } return true;
  }
  if(a === 'dashunlock'){
    const st = failState(); if(st.until && Date.now() < st.until){ toast('Too many wrong attempts. Wait ' + Math.ceil((st.until - Date.now()) / 1000) + ' seconds.'); return true; }
    if(await NM_LOCAL_API.dashCheck(val('dpw'))){ localStorage.removeItem('nm_dash_fail'); dashOK = true; lastAct = Date.now(); syncLock(); route(); }
    else { const n = (st.n || 0) + 1; localStorage.setItem('nm_dash_fail', JSON.stringify(n >= 5 ? { n: 0, until: Date.now() + 30000 } : { n })); toast(n >= 5 ? 'Too many wrong attempts. Try again in 30 seconds.' : 'Wrong password'); }
    return true;
  }
  if(a === 'dashlock'){ lockDash(); return true; }
  if(a === 'dashforgot'){ modal(`<h3>Reset dashboard password</h3><p class="muted">Enter the recovery code that was shown when the password was created.</p><label>Recovery code</label><input id="f_rc" placeholder="XXXX-XXXX-XXXX"><label>New password</label><input id="f_np" type="password"><label>Repeat new password</label><input id="f_np2" type="password"><p><button class="org" data-act="dashreset">Reset password</button> <button class="alt" data-act="close">Cancel</button></p>`); return true; }
  if(a === 'dashreset'){
    if(val('f_np') !== val('f_np2')){ toast('The two passwords do not match'); return true; }
    try { const code = await NM_LOCAL_API.dashChange({ code: val('f_rc') }, val('f_np')); dashOK = true; lastAct = Date.now(); syncLock(); showCode(code, 'Password reset'); } catch(e){ toast(e.message, 6000); } return true;
  }
  if(a === 'dashchange'){ modal(`<h3>Change dashboard password</h3><label>Current password</label><input id="f_cp" type="password"><label>New password (at least 6 characters)</label><input id="f_np" type="password"><label>Repeat new password</label><input id="f_np2" type="password"><p class="muted">Tell the accountant and the proprietors the new password afterwards.</p><p><button class="org" data-act="dashsave">Change password</button> <button class="alt" data-act="close">Cancel</button></p>`); return true; }
  if(a === 'dashsave'){
    if(val('f_np') !== val('f_np2')){ toast('The two passwords do not match'); return true; }
    try { await NM_LOCAL_API.dashChange({ password: val('f_cp') }, val('f_np')); closeModal(); toast('Password changed'); } catch(e){ toast(e.message, 6000); } return true;
  }
  if(a === 'codeok'){ modalSticky = false; closeModal(); route(); return true; }
  return false;
}


/* ============================ boot / auth ============================ */
async function boot(){
  if(!cfg){ return setupScreen(); }
  sb = supabase.createClient(cfg.url, cfg.key, { auth: { persistSession: true, autoRefreshToken: true } });
  let session = null;
  try { session = (await sb.auth.getSession()).data.session; } catch(e){}
  if(!session && !online() && localStorage.getItem('nm_cache')){ restoreCache(); return shell(); }  // offline: use last session cache
  if(!session) return loginScreen();
  S.user = session.user;
  await loadAll(true);
  if(!S.profile) return createSchoolScreen();
  await initDash(); subscribe(); shell(); flushQueue();
}
function setupScreen(){
  $('#app').innerHTML = `<div class="login"><h2>Connect to your cloud database</h2><p class="muted">Paste the Project URL and the <b>anon / public</b> key from Supabase (Project Settings → API). Saved on this device only.</p>
  <label>Project URL</label><input id="u" placeholder="https://xxxx.supabase.co"><label>Anon public key</label><input id="k">
  <p><button id="go">Save and continue</button></p></div>`;
  $('#go').onclick = () => { const url = $('#u').value.trim(), key = $('#k').value.trim(); if(!/^https:\/\/.+/.test(url) || key.length < 20) return toast('Enter a valid URL and key'); localStorage.setItem('nm_cfg', JSON.stringify({ url, key })); location.reload(); };
}
function loginScreen(msg){
  $('#app').innerHTML = `<div class="login"><div style="text-align:center"><div class="logo" style="width:54px;height:54px;border-radius:50%;border:4px solid var(--orange);background:var(--navy);color:#fff;margin:auto;display:grid;place-items:center;font-weight:700">NM</div><h2 style="color:var(--navy)">Noble Minds<br>School Accounting System</h2></div>
  <p class="muted">${esc(msg || 'Sign in, or create an account if you are the first user of your school.')}</p>
  <label>Email</label><input id="em" type="email" autocomplete="username"><label>Password (min 8 characters)</label><input id="pw" type="password" autocomplete="current-password">
  <p><button id="in">Sign in</button> <button id="up" class="alt">Create account</button> <button id="rs" class="alt" style="float:right">Forgot?</button></p>
  <p class="muted"><a href="#" id="cfgreset">Change database connection</a></p></div>`;
  $('#in').onclick = async () => { const { error } = await sb.auth.signInWithPassword({ email: $('#em').value.trim(), password: $('#pw').value }); if(error) return toast(error.message); boot(); };
  $('#up').onclick = async () => { const { data, error } = await sb.auth.signUp({ email: $('#em').value.trim(), password: $('#pw').value }); if(error) return toast(error.message); if(!data.session) return toast('Account created. Check your email to confirm, then sign in.', 7000); boot(); };
  $('#rs').onclick = async () => { const e = $('#em').value.trim(); if(!e) return toast('Enter your email first'); const { error } = await sb.auth.resetPasswordForEmail(e); toast(error ? error.message : 'Password reset email sent'); };
  $('#cfgreset').onclick = ev => { ev.preventDefault(); localStorage.removeItem('nm_cfg'); location.reload(); };
}
function createSchoolScreen(){
  $('#app').innerHTML = `<div class="login"><h2>Create your school</h2><p class="muted">Your school's records are saved <b>only in this browser on this computer</b>. Download a backup regularly from the Backup button.</p>
  <label>School name</label><input id="sn"><label>Receipt prefix (2-8 letters/digits)</label><input id="sp" value="NMI" maxlength="8"><label>Your full name</label><input id="fn">
  <p><button id="mk">Create school</button></p></div>`;
  $('#mk').onclick = async () => { const { error } = await sb.rpc('create_school', { p_name: $('#sn').value.trim(), p_prefix: $('#sp').value.trim().toUpperCase(), p_full_name: $('#fn').value.trim() }); if(error) return toast(error.message, 6000); boot(); };
}
async function signOut(){ await sb.auth.signOut(); localStorage.removeItem('nm_cache'); location.reload(); }

/* ============================ data ============================ */
function restoreCache(){ try { Object.assign(S, JSON.parse(localStorage.getItem('nm_cache'))); } catch(e){} }
async function loadAll(first){
  if(online()){
    try {
      const g = async q => { const { data, error } = await q; if(error) throw error; return data; };
      const [prof] = await Promise.all([g(sb.from('profiles').select('*').eq('id', S.user.id).maybeSingle())]);
      S.profile = prof; if(!prof) return;
      const [school, classes, terms, students, fees, balances, payments, invoices, team, staff, salary, payroll, loans, loanBal, expenses, expPay, itemStock, purchases, sales] = await Promise.all([
        g(sb.from('schools').select('*').maybeSingle()), g(sb.from('classes').select('*').order('name')),
        g(sb.from('terms').select('*').order('start_date', { ascending: false })), g(sb.from('students').select('*').order('admission_no')),
        g(sb.from('fee_schedule').select('*').order('session').order('class_name')), g(sb.from('student_balances').select('*')),
        g(sb.from('payment_list').select('*').order('created_at', { ascending: false }).limit(2000)),
        g(sb.from('invoices').select('*').order('created_at', { ascending: false }).limit(3000)), g(sb.from('profiles').select('*')),
        g(sb.from('staff').select('*').order('staff_no')), g(sb.from('salary_structure').select('*')), g(sb.from('payroll_list').select('*').order('month', { ascending: false }).limit(1500)),
        g(sb.from('loans').select('*').order('created_at', { ascending: false })), g(sb.from('staff_loan_balances').select('*')), g(sb.from('expenses').select('*').order('created_at', { ascending: false }).limit(1500)),
        g(sb.from('expense_payments').select('*')), g(sb.from('item_stock').select('*').order('code')), g(sb.from('stock_purchases').select('*').order('created_at', { ascending: false }).limit(1500)),
        g(sb.from('stock_sales').select('*').order('created_at', { ascending: false }).limit(1500))]);
      Object.assign(S, { school, classes, terms, students, fees, balances, payments, invoices, team, staff, salary, payroll, loans, loanBal, expenses, expPay, itemStock, purchases, sales });
      /* local edition: the database itself is the browser store, no separate cache */
    } catch(e){ if(isNetErr(e)) restoreCache(); else toast('Load error: ' + e.message, 6000); }
  } else restoreCache();
  if(!first) route();
}
const debLoad = () => { clearTimeout(loadTimer); loadTimer = setTimeout(() => loadAll(), 600); };
function subscribe(){
  if(chan) sb.removeChannel(chan);
  chan = sb.channel('nm-' + S.profile.school_id);
  for(const t of ['students', 'classes', 'terms', 'fee_schedule', 'invoices', 'payments', 'staff', 'salary_structure', 'payroll_lines', 'payroll_payments', 'loans', 'expenses', 'expense_payments', 'items', 'stock_purchases', 'stock_sales'])
    chan.on('postgres_changes', { event: '*', schema: 'public', table: t, filter: 'school_id=eq.' + S.profile.school_id }, debLoad);
  chan.subscribe(st => { live = st === 'SUBSCRIBED'; chip(); });
}

/* ===== write layer: online -> run now; offline/network error -> queue and replay safely ===== */
async function exec(item){
  if(item.kind === 'rpc'){ const { data, error } = await sb.rpc(item.fn, item.args); if(error) throw error; return data; }
  if(item.kind === 'insert'){ const { error } = await sb.from(item.table).insert(item.row); if(error) throw error; return null; }
  if(item.kind === 'update'){ const { error } = await sb.from(item.table).update(item.row).eq('id', item.id); if(error) throw error; return null; }
}
async function write(item){
  item.qid = uuid(); item.label = item.label || item.fn || item.table;
  if(online()){
    try { const r = await exec(item); await loadAll(); return { ok: true, data: r }; }
    catch(e){ if(!isNetErr(e)) return { ok: false, error: e.message }; }
  }
  Q.push(item); saveQ(); chip(); return { ok: true, queued: true };
}
async function flushQueue(){
  if(flushing || !online() || !Q.length || !sb) return; flushing = true;
  for(const item of [...Q]){
    if(item.failed) continue;
    try { await exec(item); Q = Q.filter(x => x.qid !== item.qid); saveQ(); }
    catch(e){ if(isNetErr(e)) break; item.failed = e.message; saveQ(); }   // business rule failed: keep for attention, never lose silently
  }
  flushing = false; chip(); await loadAll(); if(Q.length === 0) toast('All offline entries synced');
}
window.addEventListener('online', () => { chip(); flushQueue(); }); window.addEventListener('offline', chip);

async function saveStaff(id){

  if(row.email && !validEmail(row.email)) return toast('That email address does not look right');
  const sid = id || uuid();
  if(id){ const r = await write({ kind: 'update', table: 'staff', id, row, label: 'Edit staff' }); if(!r.ok) return toast(r.error, 6000); }
  else { const no = val('f_no').trim(); if(!no) return toast('Staff number required'); if(S.staff.some(s => s.staff_no === no)) return toast('Staff number exists');

  if(isOwner()){
    const m = x => (toKobo(val(x) || '0') ?? 0); const sal = { basic_kobo: m('f_b'), housing_kobo: m('f_h'), transport_kobo: m('f_t'), other_allowance_kobo: m('f_o'), other_fixed_deduction_kobo: m('f_fd'), annual_rent_kobo: m('f_rn') };

    if(!r.ok) return toast(r.error, 6000);
  }
  closeModal(); toast('Saved'); if(online()) await loadAll();
}

  <p style="margin-top:22px;font-size:11px">Prepared: ____________ &nbsp; Approved: ____________ &nbsp; Received: ____________</p></div></div><p><button onclick="window.print()">Print</button> <button class="alt" data-act="close">Close</button></p>`);
}

function pgStock(){
  const tab = pgStock.tab || 'items', head = tabBar('Stock: uniforms, textbooks, sportswear', tab, [['items', 'Items & stock'], ['buy', 'Purchases'], ['sell', 'Sales']], 'sttab');
  const code = id => (S.itemStock.find(i => i.item_id === id) || {}).code || '?';
  if(tab === 'buy') return head + `<div class="panel">${canWrite() ? '<div class="bar"><button data-act="newbuy">Record purchase / return / opening stock</button></div>' : ''}<div class="tw"><table><tr><th>Ref</th><th>Date</th><th>Type</th><th>Item</th><th class="num">Qty</th><th class="num">Unit cost ₦</th><th>Mode</th><th>Supplier</th></tr>${S.purchases.map(p => `<tr><td>${p.ref_no}</td><td>${p.purchase_date}</td><td>${p.kind}</td><td>${esc(code(p.item_id))}</td><td class="num">${p.signed_qty}</td><td class="num">${fmt(p.unit_cost_kobo)}</td><td>${p.pay_mode}</td><td>${esc(p.supplier)}</td></tr>`).join('')}</table></div></div>`;
  if(tab === 'sell') return head + `<div class="panel">${canWrite() ? '<div class="bar"><button data-act="newsale">Record sale / return</button></div>' : ''}<div class="tw"><table><tr><th>Ref</th><th>Date</th><th>Item</th><th class="num">Qty</th><th class="num">Total ₦</th><th>Student</th><th>Mode</th></tr>${S.sales.map(s => `<tr><td>${s.ref_no}</td><td>${s.sale_date}</td><td>${esc(code(s.item_id))}</td><td class="num">${s.signed_qty}</td><td class="num">${fmt(s.total_kobo)}</td><td>${s.student_id ? esc(stuName(s.student_id)) : ''}</td><td>${s.pay_mode}</td></tr>`).join('')}</table></div></div>`;
  const val_ = S.itemStock.reduce((a, i) => a + Number(i.stock_value_kobo), 0);
  return head + `<div class="panel">${canWrite() ? '<div class="bar"><button data-act="newitem">Add item</button></div>' : ''}<div class="tw"><table><tr><th>Code</th><th>Item</th><th>Category</th><th class="num">Price ₦</th><th class="num">In stock</th><th class="num">Reorder at</th><th class="num">Stock value ₦</th><th></th></tr>
  ${S.itemStock.map(i => `<tr><td>${esc(i.code)}</td><td>${esc(i.name)}</td><td>${i.category}</td><td class="num">${fmt(i.price_kobo)}</td><td class="num">${i.balance}</td><td class="num">${i.reorder_level}</td><td class="num">${fmt(i.stock_value_kobo)}</td><td>${i.reorder ? '<span class="tag CANCELLED">REORDER</span>' : ''}</td></tr>`).join('')}
  <tr><th colspan=6>Total stock at cost</th><th class="num">${fmt(val_)}</th><th></th></tr></table></div><p class="muted">Cost of goods sold uses the weighted-average cost of purchases to the sale date. Sales beyond stock are refused.</p></div>`;
}
function itemForm(){ modal(`<h3>Add item</h3><div class="g2"><div><label>Code</label><input id="f_c"></div><div><label>Category</label><select id="f_k">${opt(['Uniform', 'Textbook', 'Sportswear'])}</select></div><div><label>Name</label><input id="f_n"></div><div><label>Selling price (₦)</label><input id="f_p" inputmode="decimal"></div><div><label>Reorder level</label><input id="f_r" type="number" value="5"></div></div><p><button data-act="saveitem">Save</button> <button class="alt" data-act="close">Cancel</button></p>`); }
async function saveItem(){
  const p = toKobo(val('f_p') || '0'); if(!val('f_c').trim() || !val('f_n').trim() || p === null) return toast('Complete the form');
  const r = await write({ kind: 'insert', table: 'items', row: { id: uuid(), school_id: S.profile.school_id, code: val('f_c').trim().toUpperCase(), name: val('f_n').trim(), category: val('f_k'), price_kobo: p, reorder_level: parseInt(val('f_r') || '0', 10) }, label: 'New item' });
  if(!r.ok) return toast(r.error, 6000); closeModal(); if(!r.queued) await loadAll(); toast('Saved');
}
function buyForm(){ modal(`<h3>Stock purchase / return / opening stock</h3><label>Item</label><select id="f_i">${itemOpts()}</select><div class="g2"><div><label>Date</label><input type="date" id="f_d" value="${today()}"></div><div><label>Type</label><select id="f_k"><option value="purchase">Purchase</option><option value="supplier_return">Supplier return</option><option value="opening">Opening stock</option></select></div>
  <div><label>Quantity</label><input id="f_q" type="number" min="1"></div><div><label>Unit cost (₦)</label><input id="f_u" inputmode="decimal"></div><div><label>Paid by</label><select id="f_m">${opt(['Cash', 'Bank Transfer', 'POS', 'Cheque', 'Credit'])}</select></div><div><label>Supplier</label><input id="f_s"></div></div><label>Document ref</label><input id="f_r"><p class="muted">Opening stock ignores “Paid by”.</p><p><button data-act="savebuy">Save</button> <button class="alt" data-act="close">Cancel</button></p>`); }
async function saveBuy(){
  const q = parseInt(val('f_q'), 10), u = toKobo(val('f_u')); if(!q || q < 1 || u === null) return toast('Enter quantity and unit cost');
  const r = await write({ kind: 'rpc', fn: 'record_purchase', args: { p_client_ref: uuid(), p_date: val('f_d'), p_kind: val('f_k'), p_supplier: val('f_s') || null, p_item_id: val('f_i'), p_qty: q, p_unit_cost_kobo: u, p_pay_mode: val('f_m'), p_doc_ref: val('f_r') || null }, label: 'Stock purchase' });
  if(!r.ok) return toast(r.error, 7000); closeModal(); if(!r.queued) await loadAll(); toast(r.queued ? 'Saved offline — will sync' : 'Recorded');
}
function saleForm(){ modal(`<h3>Stock sale / return</h3><label>Item</label><select id="f_i">${itemOpts()}</select><div class="g2"><div><label>Date</label><input type="date" id="f_d" value="${today()}"></div><div><label>Type</label><select id="f_k"><option value="sale">Sale</option><option value="return">Return</option></select></div>
  <div><label>Quantity</label><input id="f_q" type="number" min="1"></div><div><label>Price override (₦, optional)</label><input id="f_u" inputmode="decimal"></div><div><label>Payment</label><select id="f_m">${opt(['Cash', 'Bank Transfer', 'POS', 'Cheque', 'Student Account'])}</select></div><div><label>Student (needed for Student Account)</label><select id="f_s"><option value="">—</option>${stuOpts()}</select></div></div><label>Document ref</label><input id="f_r">
  <p class="muted">“Student Account” adds the amount to the student's fees balance — do not also invoice it.</p><p><button data-act="savesale">Save</button> <button class="alt" data-act="close">Cancel</button></p>`); }
async function saveSale(){
  const q = parseInt(val('f_q'), 10); if(!q || q < 1) return toast('Enter a quantity'); const u = val('f_u').trim() ? toKobo(val('f_u')) : null; if(val('f_u').trim() && u === null) return toast('Invalid price');
  const r = await write({ kind: 'rpc', fn: 'record_sale', args: { p_client_ref: uuid(), p_date: val('f_d'), p_kind: val('f_k'), p_item_id: val('f_i'), p_qty: q, p_unit_price_kobo: u, p_student_id: val('f_s') || null, p_pay_mode: val('f_m'), p_doc_ref: val('f_r') || null }, label: 'Stock sale' });
  if(!r.ok) return toast(r.error, 7000); closeModal(); if(!r.queued) await loadAll(); toast(r.queued ? 'Saved offline — will sync' : 'Recorded');
}
async function rpcNow(fn, args, okMsg){ if(!needOnline()) return false; const { data, error } = await sb.rpc(fn, args); if(error){ toast(error.message, 7000); return false; } await loadAll(); toast(typeof okMsg === 'function' ? okMsg(data) : okMsg); return true; }
async function stage2(a, id, t){
  switch(a){
    case 'prtab': pgPayroll.tab = t.dataset.t; route(); return true;
    case 'sttab': pgStock.tab = t.dataset.t; route(); return true;
    case 'prgen': await rpcNow('generate_payroll', { p_month: (pgPayroll.month || $('#pm').value + '-01').slice(0, 7) + '-01' }, n => n + ' payroll lines calculated'); return true;
    case 'prapprove': if(!confirm('Approve this month’s payroll? Approved lines become final.')) return true;
      await rpcNow('approve_payroll', { p_month: $('#pm').value + '-01' }, r => `${r.approved} approved` + (r.blocked ? `, ${r.blocked} still blocked` : '')); return true;
    case 'prpaid': modal(`<h3>Mark payroll paid</h3><div class="g2"><div><label>Method</label><select id="f_m">${opt(['Bank Transfer', 'Cash', 'Cheque', 'POS'])}</select></div><div><label>Date</label><input type="date" id="f_d" value="${today()}"></div></div><p class="muted">Marks every approved, unpaid line for the month as paid.</p><p><button data-act="savepaid">Confirm</button> <button class="alt" data-act="close">Cancel</button></p>`); return true;
    case 'savepaid': closeModal(); await rpcNow('mark_payroll_paid', { p_month: $('#pm').value + '-01', p_method: val('f_m'), p_date: val('f_d') }, n => n + ' lines marked paid'); return true;
    case 'payslip': payslip(id); return true;
    case 'pradj': adjForm(id); return true;
    case 'saveadj': { const x = toKobo(val('f_x') || '0'); if(x === null) { toast('Invalid amount'); return true; } const ov = $('#f_ov') ? $('#f_ov').checked : false; closeModal(); await rpcNow('set_payroll_adjustment', { p_line_id: id, p_extra_kobo: x, p_authorise_override: ov }, 'Updated'); return true; }
    case 'newstaff': staffForm(); return true; case 'editstaff': staffForm(id); return true; case 'savestaff': await saveStaff(id); return true;
    case 'newloan': loanForm(); return true; case 'saveloan': await saveLoan(); return true;
    case 'newexp': expForm(); return true; case 'saveexp': await saveExp(); return true;
    case 'exapp': await rpcNow('decide_expense', { p_expense_id: id, p_approve: true, p_note: null }, 'Approved — voucher issued'); return true;
    case 'exrej': modal(`<h3>Reject expense</h3><label>Reason (required)</label><input id="f_r"><p><button class="bad" data-act="saverej" data-id="${id}">Reject</button> <button class="alt" data-act="close">Cancel</button></p>`); return true;
    case 'saverej': { const r = val('f_r').trim(); if(!r) { toast('A reason is required'); return true; } closeModal(); await rpcNow('decide_expense', { p_expense_id: id, p_approve: false, p_note: r }, 'Rejected'); return true; }
    case 'exsettle': modal(`<h3>Settle credit expense</h3><div class="g2"><div><label>Paid by</label><select id="f_m">${opt(METHODS, 'Bank Transfer')}</select></div><div><label>Date</label><input type="date" id="f_d" value="${today()}"></div></div><p><button data-act="savesettle" data-id="${id}">Settle</button> <button class="alt" data-act="close">Cancel</button></p>`); return true;
    case 'savesettle': closeModal(); await rpcNow('settle_expense', { p_expense_id: id, p_method: val('f_m'), p_date: val('f_d') }, 'Settled'); return true;
    case 'voucher': voucher(id); return true;
    case 'newitem': itemForm(); return true; case 'saveitem': await saveItem(); return true;
    case 'newbuy': buyForm(); return true; case 'savebuy': await saveBuy(); return true;
    case 'newsale': saleForm(); return true; case 'savesale': await saveSale(); return true;
  }
  return false;
}


/* ============================ LOCAL EDITION: backup / restore ============================ */
async function refreshBackupInfo(){ try { lastBackup = await NM_LOCAL_API.lastBackup(); } catch(e){ lastBackup = null; } }
function backupPanel(){
  return `<div class="panel" style="border-color:var(--orange)"><h2>Backup & restore</h2>
  <p>All records are stored <b>only in this browser on this computer</b>. They are lost if browsing data is cleared, the browser is reinstalled, or you open the app on another computer. <b>Download a backup every week and after every month-end</b>, and keep a copy on a flash drive or email it to yourself.</p>
  <p><button data-act="backup">Download backup (.json)</button> <label class="btn alt" style="display:inline-block;cursor:pointer;padding:8px 12px">Restore from a backup file…<input type="file" id="bkfile" accept=".json,application/json" style="display:none"></label> <button class="bad" data-act="wipe" style="float:right">Erase all data on this device</button></p>
  <p class="muted">Last backup: ${lastBackup ? new Date(lastBackup).toLocaleString() : 'never'}. To move to another computer: download a backup here, open the app there, and use “Restore from a backup file”.</p></div>`;
}
function backupModal(){ modal(`<h3>Backup & restore</h3><p>Your data lives only in this browser. Download a backup regularly.</p><p><button data-act="backup">Download backup now</button> <button class="alt" data-act="close">Close</button></p><p class="muted">Last backup: ${lastBackup ? new Date(lastBackup).toLocaleString() : 'never'}. Restore is on the School Setup page.</p>`); }
async function downloadBackup(){
  const json = await NM_LOCAL_API.exportJSON(); const name = (S.school ? S.school.name : 'school').replace(/[^A-Za-z0-9]+/g, '-').replace(/^-|-$/g, '');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([json], { type: 'application/json' })); a.download = `NobleMinds-backup-${name}-${new Date().toISOString().slice(0, 10)}.json`; document.body.appendChild(a); a.click(); a.remove();
  await refreshBackupInfo(); route(); toast('Backup downloaded — keep it somewhere safe');
}
async function restoreFile(f){
  if(!f) return; if(!confirm('Restore from "' + f.name + '"? This REPLACES all data currently on this device.')) return;
  try { await NM_LOCAL_API.importJSON(await f.text()); toast('Restored. Reloading…'); setTimeout(() => location.reload(), 600); } catch(e){ toast('Restore failed: ' + e.message, 7000); }
}
async function localActs(a){
  if(a === 'backup'){ await downloadBackup(); return true; }
  if(a === 'wipe'){ modal(`<h3>Erase all data?</h3><p class="neg"><b>This permanently deletes every record on this device.</b> Download a backup first if you may need it.</p><label>Type ERASE to confirm</label><input id="f_w">${dashSet ? '<label>Dashboard password</label><input id="f_wp" type="password">' : ''}<p><button class="bad" data-act="dowipe">Erase everything</button> <button class="alt" data-act="close">Cancel</button></p>`); return true; }
  if(a === 'dowipe'){ if(val('f_w').trim() !== 'ERASE') { toast('Type ERASE to confirm'); return true; } if(dashSet && !(await NM_LOCAL_API.dashCheck(val('f_wp')))) { toast('Enter the dashboard password to erase data'); return true; } await NM_LOCAL_API.reset(); location.reload(); return true; }
  return false;
}

/* ============================ event delegation ============================ */
document.addEventListener('click', async e => {
  const t = e.target.closest('[data-act]'); if(!t) return; const a = t.dataset.act, id = t.dataset.id; if(t.tagName === 'A') e.preventDefault();
  if(await localActs(a, id, t)) return;
  if(await dashActs(a, id, t)) return;
  if(slipActs(a, id, t)) return;
  if(rcptActs(a, id, t)) return;
  if(a === 'expcat'){ pgExpenses.cat = t.dataset.c || ''; route(); return; }
  if(await stage2(a, id, t)) return;
  if(a === 'close') closeModal();
  else if(a === 'newpay') payForm(id); else if(a === 'savepay') await savePay();
  else if(a === 'rcpt') showReceipt(id); else if(a === 'reverse') reverseForm(id); else if(a === 'savereverse') await saveReverse(id);
  else if(a === 'newrefund') refundForm(id); else if(a === 'saverefund') await saveRefund();
  else if(a === 'newstu') stuForm(); else if(a === 'editstu') stuForm(id); else if(a === 'savestu') await saveStu(id);
  else if(a === 'newfee') feeForm(); else if(a === 'savefee') await saveFee(); else if(a === 'gen') genForm(); else if(a === 'savegen') await saveGen();
  else if(a === 'newinv') invForm(); else if(a === 'saveinv') await saveInv();
  else if(a === 'tab'){ pgFees.tab = t.dataset.t; route(); }
  else if(a === 'coll'){ pgPay.from = val('cf'); pgPay.to = val('ct'); route(); }
  else if(a === 'sync'){ closeModal(); Q.forEach(q => delete q.failed); saveQ(); flushQueue(); }
  else if(a === 'drop'){ Q = Q.filter(q => q.qid !== id); saveQ(); chip(); closeModal(); if(Q.length) pendingModal(); }
  else if(a === 'newclass') simpleInsert('Add class', '<label>Class name</label><input id="f_n"><label>Level</label><select id="f_l"><option>Nursery</option><option>Primary</option><option>Secondary</option></select><label>Class teacher</label><input id="f_t">', 'classes', () => val('f_n').trim() ? { name: val('f_n').trim(), level: val('f_l'), class_teacher: val('f_t') } : (toast('Name required'), null));
  else if(a === 'newterm') simpleInsert('Add term', '<label>Session (e.g. 2026/2027)</label><input id="f_s"><label>Term</label><select id="f_t"><option>Term 1</option><option>Term 2</option><option>Term 3</option></select><div class="g2"><div><label>Start</label><input type="date" id="f_a"></div><div><label>End</label><input type="date" id="f_b"></div></div>', 'terms', () => (val('f_s') && val('f_a') && val('f_b')) ? { session: val('f_s').trim(), term: val('f_t'), start_date: val('f_a'), end_date: val('f_b') } : (toast('Complete the form'), null));
  else if(a === 'savesimple') await saveSimple();
  else if(a === 'editschool'){ const s = S.school; modal(`<h3>School details</h3><label>Name</label><input id="f_n" value="${esc(s.name)}"><label>Address</label><input id="f_a" value="${esc(s.address)}"><div class="g2"><div><label>Phone</label><input id="f_p" value="${esc(s.phone)}"></div><div><label>Email</label><input id="f_e" value="${esc(s.email)}"></div></div><label>Overpayment policy</label><select id="f_o"><option value="allow" ${s.overpayment_policy === 'allow' ? 'selected' : ''}>Allow — hold excess as advance credit</option><option value="block" ${s.overpayment_policy === 'block' ? 'selected' : ''}>Block overpayments</option></select><p><button data-act="saveschool">Save</button> <button class="alt" data-act="close">Cancel</button></p>`); }
  else if(a === 'saveschool'){ const { error } = await sb.from('schools').update({ name: val('f_n'), address: val('f_a'), phone: val('f_p'), email: val('f_e'), overpayment_policy: val('f_o') }).eq('id', S.school.id); if(error) return toast(error.message); closeModal(); await loadAll(); }
  else if(a === 'addmember'){ const { error } = await sb.rpc('add_member', { p_email: val('te').trim(), p_role: val('tr') }); if(error) return toast(error.message, 6000); await loadAll(); toast('Member added'); }
});
document.addEventListener('input', e => {
  if(e.target.id === 'srch'){ pgPay.q = e.target.value; refreshPayList(); }
  if(e.target.id === 'sq'){ pgStudents.q = e.target.value; const pos = e.target.selectionStart; route(); const n = $('#sq'); if(n){ n.focus(); n.setSelectionRange(pos, pos); } }
});
document.addEventListener('change', e => { if(e.target.id === 'sc'){ pgStudents.cl = e.target.value; route(); } if(e.target.id === 'ef'){ pgExpenses.f = e.target.value; route(); } if(e.target.id === 'es'){ pgExpenses.so = e.target.value; route(); }
  if(e.target.id === 'pcl'){ pgPay.cl = e.target.value; refreshPayList(); } if(e.target.id === 'plf'){ pgPay.lf = e.target.value; refreshPayList(); } if(e.target.id === 'plt'){ pgPay.lt = e.target.value; refreshPayList(); }
  if(e.target.id === 'ppp') pgPay.pp = e.target.value; if(e.target.id === 'spp') pgPayroll.pp = e.target.value;
  const c = e.target;
  if(c.classList && c.classList.contains('chk-pay')){ c.checked ? selPay.add(c.dataset.id) : selPay.delete(c.dataset.id); updPaySel(); }
  if(c.id === 'chkall-pay'){ document.querySelectorAll('.chk-pay').forEach(x => { x.checked = c.checked; c.checked ? selPay.add(x.dataset.id) : selPay.delete(x.dataset.id); }); updPaySel(); }
  if(c.classList && c.classList.contains('chk-slip')){ c.checked ? selSlip.add(c.dataset.id) : selSlip.delete(c.dataset.id); $('#slipsel').textContent = selSlip.size + ' selected'; }
  if(c.id === 'chkall-slip'){ document.querySelectorAll('.chk-slip').forEach(x => { x.checked = c.checked; c.checked ? selSlip.add(x.dataset.id) : selSlip.delete(x.dataset.id); }); $('#slipsel').textContent = selSlip.size + ' selected'; } if(e.target.id === 'pm'){ pgPayroll.month = e.target.value + '-01'; route(); } });
document.addEventListener('keydown', e => { if(e.key === 'Enter' && e.target.id === 'dpw'){ const b = document.querySelector('[data-act=dashunlock],[data-act=dashcreate]'); if(b && e.target.autocomplete === 'current-password') b.click(); } });
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
document.addEventListener('change', e => { if(e.target.id === 'bkfile') restoreFile(e.target.files[0]); });
if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
NM_LOCAL_API.onExternalChange(() => debLoad());
refreshBackupInfo().then(boot);
})();
</script>
